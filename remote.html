<title>Shadow Stream Remote</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#2a0d4a,#0b0614 70%);color:#f5f3ff;
  font-family:'Rajdhani',sans-serif;padding:calc(20px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:18px}
header{display:flex;align-items:center;gap:12px}
header img{width:56px;height:56px;filter:drop-shadow(0 0 12px rgba(168,85,247,.6))}
h1{font-family:'Press Start 2P',monospace;font-size:15px;line-height:1.5;text-shadow:0 0 10px #a855f7}
#status{font-size:18px;color:#d8b4fe;text-align:center;min-height:24px}
#status b{color:#fff}
.grid{width:100%;max-width:520px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{border:3px solid #a855f7;background:rgba(20,6,40,.85);color:#fff;border-radius:14px;
  padding:26px 10px;font-family:'Press Start 2P',monospace;font-size:13px;line-height:1.6;cursor:pointer;
  box-shadow:0 0 14px rgba(168,85,247,.35);transition:transform .1s, background .2s}
button span{display:block;font-size:30px;margin-bottom:10px}
button:active{transform:scale(.96)}
button.on{background:#a855f7;box-shadow:0 0 28px rgba(168,85,247,.9)}
button[data-s="live"].on{background:#dc2626;border-color:#ef4444;box-shadow:0 0 28px rgba(239,68,68,.8)}
.note{max-width:520px;font-size:15px;color:#c4b5fd;opacity:.8;text-align:center;line-height:1.4}
</style>
</head>

<div id="status">Connecting…</div>
<div class="grid">
  <button data-s="starting"><span>⏳</span>STARTING</button>
  <button data-s="live"><span>🔴</span>LIVE</button>
  <button data-s="brb"><span>☕</span>BRB</button>
  <button data-s="ending"><span>👋</span>ENDING</button>
</div>
<p class="note">Tap a button and your PRISM overlay switches in a second or two. Keep this page private — anyone with this link can switch your screens.</p>
<script>
const TOPIC = "shadow305-223mlulzgnjl1g";
const base = "https://ntfy.sh/" + TOPIC;
const NAMES = {starting:"Starting Soon", live:"Live", brb:"Be Right Back", ending:"Ending"};
const st = document.getElementById("status");
function mark(sc){
  document.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.s===sc));
  if (NAMES[sc]) st.innerHTML = "On screen now: <b>" + NAMES[sc] + "</b>";
}
document.querySelectorAll("button").forEach(b=>b.addEventListener("click", async ()=>{
  const sc = b.dataset.s;
  st.textContent = "Switching to " + NAMES[sc] + "…";
  try {
    const r = await fetch(base, {method:"POST", body:sc});
    if (!r.ok) throw new Error(r.status);
    mark(sc);
    if (navigator.vibrate) navigator.vibrate(30);
  } catch(e){
    st.textContent = "Couldn't send — check your internet and tap again.";
  }
}));
// show what's on screen right now
fetch(base + "/json?poll=1&since=12h").then(r=>r.text()).then(t=>{
  const lines = t.trim().split("\n").filter(Boolean);
  for (let i = lines.length-1; i >= 0; i--){
    try { const m = JSON.parse(lines[i]); if (m.event==="message"){ mark(m.message.trim()); return; } } catch(e){}
  }
  st.textContent = "Ready — tap a screen to show it.";
}).catch(()=>{ st.textContent = "Ready — tap a screen to show it."; });
</script>
